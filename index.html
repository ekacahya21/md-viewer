    {
      "@context": "https://schema.org",

        {
          "@type": "Question",
          "name": "Apa itu MD Viewer dan apa keunggulannya?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "MD Viewer adalah aplikasi web Markdown Studio dan Reader minimalis berstandar editorial. Keunggulannya meliputi rendering diagram Mermaid 11+, formula matematika KaTeX LaTeX, ekspor instan ke PDF dan Standalone HTML, berbagi dokumen via Short URL dengan QR code, serta penyimpanan draf offline tanpa perlu akun."

        },
        {
          "@type": "Question",
          "name": "Bagaimana cara merender diagram Mermaid di MD Viewer?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Gunakan blok kode berpagar dengan bahasa 'mermaid' (contohnya: flowchart TD, sequenceDiagram, classDiagram, erDiagram, atau gantt). MD Viewer merender diagram Mermaid secara interaktif dan responsif."
          }
        },
        {
          "@type": "Question",
          "name": "Bagaimana cara menulis rumus matematika LaTeX di MD Viewer?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Gunakan tanda dolar tunggal ($E = mc^2$) untuk formula sebaris (inline) atau tanda dolar ganda ($$...$$) untuk blok matematika display. KaTeX akan merendernya secara instan dan tajam."
          }
        },
        {
          "@type": "Question",
          "name": "Apakah MD Viewer gratis dan memerlukan login akun?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "MD Viewer 100% gratis digunakan tanpa batasan dan mengusung prinsip zero-friction privacy-first. Anda tidak perlu mendaftar ataupun login untuk menulis, membaca, maupun membagikan dokumen."
          }
        },
        {
          "@type": "Question",
          "name": "Bagaimana cara membagikan dokumen markdown dengan Short URL?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Klik tombol Share di bilah atas untuk membuat tautan pendek publik (/s/:id) dan QR Code. Penerima akan membuka dokumen dalam mode Read-Only yang bersih. Jika Anda mengedit dokumen asli, Anda dapat memperbarui konten tautan yang sama dengan tombol Perbarui Tautan Sekarang."
          }
        },
        {
          "@type": "Question",
          "name": "Bagaimana cara ekspor dokumen ke PDF atau file HTML mandiri?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Buka menu dropdown Export di bilah atas, lalu pilih 'Print / Save as PDF' untuk mencetak dalam layout editorial bersih, atau 'Standalone HTML' untuk mengunduh satu file HTML lengkap tanpa dependensi luar."
          }
        }
